<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBF4E9" />
<title>清晨工作台</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FBF4E9; --card:#FFFFFF; --ink:#4A4039; --muted:#9B8F82;
    --line:#EFE6D6; --green:#8FBF6F; --green-d:#7AAE5A; --pink:#F4A6A6;
    --gold:#E7B65A; --blue:#8FB6DD; --shadow:0 6px 20px rgba(120,95,60,.10);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
  }
  .app{display:flex; height:100vh; height:100dvh}

  /* ---------- 侧栏（桌面） ---------- */
  .sidebar{
    width:200px; flex:0 0 200px; background:color-mix(in srgb, var(--card) 55%, transparent);
    backdrop-filter:blur(6px); border-right:1px solid var(--line);
    padding:18px 12px; display:flex; flex-direction:column; gap:4px; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 14px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:var(--green);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
  .brand b{font-size:16px}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px;
    color:var(--muted); cursor:pointer; font-size:14px; font-weight:500; user-select:none;
    transition:background .15s,color .15s;
  }
  .nav-item .ic{font-size:17px;width:20px;text-align:center}
  .nav-item:hover{background:rgba(143,191,111,.12)}
  .nav-item.active{background:var(--ink); color:#fff}
  .nav-item.active:hover{background:var(--ink)}

  /* ---------- 主区 ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0}
  .topbar{padding:18px 26px 8px; display:flex; align-items:flex-end; justify-content:space-between}
  .topbar h1{margin:0; font-size:22px}
  .topbar .date{color:var(--muted); font-size:13px; margin-top:3px}
  .topbar .hello{color:var(--muted); font-size:13px; margin-right:auto}
  .view{flex:1; overflow-y:auto; padding:10px 26px 30px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px}
  .card h2{margin:0 0 14px; font-size:16px; display:flex; align-items:center; gap:8px}
  .card h2 .tag{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto}
  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:560px){.g2{grid-template-columns:1fr}}

  .stat{background:#FBF7EF;border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:22px;font-weight:700;margin-top:4px}
  .stat .v small{font-size:13px;color:var(--muted);font-weight:500}
  .progress{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}
  .progress>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--green),var(--gold))}
  .up{color:var(--green-d)} .down{color:#D9695F}

  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .row .txt{flex:1;font-size:14px}
  .row .meta{font-size:12px;color:var(--muted)}
  .chk{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;
    display:grid;place-items:center;cursor:pointer;color:#fff;font-size:12px;transition:.15s}
  .chk.on{background:var(--green);border-color:var(--green)}
  .done .txt{text-decoration:line-through;color:var(--muted)}
  .del{cursor:pointer;color:var(--muted);background:#FBF7EF;border:1px solid var(--line);
    padding:5px 11px;border-radius:9px;font-size:12px;font-family:inherit;transition:.15s}
  .del:hover{background:#FBEAEA;color:#D9695F;border-color:#F4C9C9}

  .add{display:flex;gap:8px;margin:6px 0 4px}
  .add input,.add select{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
    background:#FBF7EF;font-size:14px;font-family:inherit;color:var(--ink);outline:none}
  .add input:focus{border-color:var(--green)}
  .btn{border:none;border-radius:11px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
    background:var(--green);color:#fff;font-family:inherit}
  .btn:hover{background:var(--green-d)}
  .btn.ghost{background:#FBF7EF;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--card)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .mini{border:1px solid var(--line);background:#FBF7EF;color:var(--muted);border-radius:9px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .mini:hover{background:var(--card);color:var(--ink)}
  .goal-in{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 8px;font-size:13px;width:96px;font-family:inherit;color:var(--ink)}
  .goal-in:focus{outline:none;border-color:var(--green)}

  /* 便签图标选择 */
  .ic-pick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
  .ic-chip{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#FBF7EF;
    font-size:17px;display:grid;place-items:center;cursor:pointer;transition:.12s;font-family:inherit;padding:0;line-height:1}
  .ic-chip:hover{background:#FFF6E4;border-color:var(--gold)}
  .ic-chip.on{background:#FFF6E4;border-color:var(--gold);box-shadow:0 0 0 2px rgba(231,198,75,.35)}

  /* 日记卡片（心情/便签/树洞） */
  .diary{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:12px;position:relative}
  .diary-head{display:flex;align-items:center;gap:10px}
  .diary-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#F4ECDB;flex:0 0 auto}
  .diary-name{font-weight:600;font-size:14px;color:var(--ink);line-height:1.2}
  .diary-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .diary-time{margin-left:auto;text-align:right;font-size:12px;line-height:1.4;color:var(--muted)}
  .diary-time b{color:var(--ink);font-weight:600;font-size:13px}
  .diary-time .yr{color:var(--muted);font-size:11px;margin-left:2px}
  .diary-body{font-size:14px;color:var(--ink);line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .diary-foot{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding-top:8px;border-top:1px dashed var(--line)}
  .diary-foot .clk{display:inline-flex;align-items:center;gap:4px}
  .diary-foot .x{margin-left:auto;cursor:pointer;color:var(--muted);padding:3px 9px;border-radius:8px;font-size:12px}
  .diary-foot .x:hover{background:#FBEAEA;color:#D9695F}
  .goal-in::-webkit-outer-spin-button,.goal-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .goal-in{-moz-appearance:textfield}
  .seg{display:inline-flex;background:#FBF7EF;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .seg button{border:none;background:none;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
  .seg button.on{background:var(--green);color:#fff}

  .habit-card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:#FFFDF8}
  .habit{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .habit .name{flex:1;font-size:15px;font-weight:600;color:var(--ink)}
  .week{display:flex;gap:6px}
  .day{width:26px;height:26px;border-radius:8px;background:#FBF7EF;border:1px solid var(--line);
    display:grid;place-items:center;font-size:12px;color:var(--muted);cursor:pointer}
  .day.on{background:var(--green);color:#fff;border-color:var(--green)}
  .habit-badge{display:inline-block;font-size:11px;background:#EAF3E2;color:#5a7a3a;border:1px solid #D5E6C5;border-radius:8px;padding:1px 7px;margin-left:8px;font-weight:600;vertical-align:middle}
  .hint{font-size:12px;color:var(--muted);background:#FBF7EF;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:8px 0 2px}

  .moods{display:flex;gap:10px;flex-wrap:wrap}
  .mood{width:52px;height:52px;border-radius:14px;background:#FBF7EF;border:1px solid var(--line);
    font-size:26px;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .mood.on,.mood:hover{border-color:var(--gold);background:#FFF6E4}

  .notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .note{padding:14px 14px 30px;border-radius:14px;min-height:110px;position:relative;
    box-shadow:0 4px 12px rgba(120,95,60,.12);font-size:14px;line-height:1.5;word-break:break-word}
  .note .x{position:absolute;right:8px;bottom:6px;cursor:pointer;color:rgba(0,0,0,.3);font-size:13px}
  .note .x:hover{color:#C0392B}
  .note .t{position:absolute;left:10px;bottom:7px;font-size:10px;color:rgba(0,0,0,.3)}

  .empty{color:var(--muted);font-size:13px;padding:8px 2px}

  /* ---------- 账户 / 弹窗 ---------- */
  .account{display:flex;align-items:center}
  .account-btn{cursor:pointer;border:1px solid var(--line);background:#FBF7EF;border-radius:20px;
    padding:7px 14px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px;font-family:inherit}
  .account-btn:hover{background:var(--card)}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:12px;font-weight:700}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
  .sync-dot.off{background:#ccc}
  /* 主题配色选择器 */
  .theme-block{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .theme-label{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px}
  .theme-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .theme-dot{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid rgba(0,0,0,.10);
    box-shadow:0 2px 6px rgba(0,0,0,.12);padding:0;font-size:18px;color:var(--muted);font-weight:700;
    display:grid;place-items:center;transition:.15s;font-family:inherit}
  .theme-dot:hover{transform:scale(1.08)}
  .theme-dot.on{outline:3px solid var(--ink);outline-offset:2px}
  .theme-custom{background:var(--card);border-style:dashed;color:var(--muted)}
  /* 设置模块 */
  .set-sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .set-sec:first-of-type{border-top:none;padding-top:4px;margin-top:6px}
  .set-t{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px}
  .set-hint{font-size:12px;color:var(--muted);margin:10px 0 4px;line-height:1.6}
  .pin-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .pin-chip{display:inline-flex;align-items:center;gap:6px;background:#FBF7EF;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--ink)}
  .pin-dot{width:10px;height:10px;border-radius:50%}
  .modal{position:fixed;inset:0;background:rgba(74,64,57,.35);display:none;place-items:center;z-index:50;padding:20px}
  .modal.on{display:grid}
  .modal .box{position:relative;background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:360px;box-shadow:var(--shadow)}
  .modal h3{margin:0 0 14px;font-size:17px}
  .modal .field{margin-bottom:12px}
  .modal label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
  .modal input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
    background:#FBF7EF;font-size:14px;font-family:inherit;outline:none}
  .modal input:focus{border-color:var(--green)}
  .modal .row2{display:flex;gap:8px;margin-top:6px}
  .modal .row2 .btn{flex:1}
  .modal .tip{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .modal .tip a{color:var(--green-d)}
  .modal .close{position:absolute;top:12px;right:16px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  .modal .err{color:#D9695F;font-size:12px;margin-top:8px;min-height:14px}

  /* ---------- 底部 Tab（手机） ---------- */
  .tabbar{display:none}
  @media(max-width:720px){
    .sidebar{display:none}
    .tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; z-index:30;
      background:color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--line);
      padding:6px 6px calc(6px + env(safe-area-inset-bottom)); gap:4px; justify-content:center}
    .tabbar::-webkit-scrollbar{display:none}
    .tabbar{scrollbar-width:none}
    .tab{flex:1 1 0; max-width:84px; padding:6px 2px; display:flex; flex-direction:column;
      align-items:center; gap:3px; font-size:11px; color:var(--muted); cursor:pointer; border-radius:12px}
    .tab .ic{font-size:20px}
    .tab.on{color:var(--green-d); background:rgba(143,191,111,.14)}
    .view{padding:calc(8px + env(safe-area-inset-top)) 16px 96px}
    .topbar{padding:calc(12px + env(safe-area-inset-top)) 16px 6px}
    .hello{display:none}
    .account-btn{font-size:12px; padding:6px 11px}
    .card{padding:16px 16px}
    /* 表单换行：避免手机上多元素挤一行 */
    .add{flex-wrap:wrap}
    .add input{flex:1 1 130px; min-width:0}
    .add select{flex:0 0 auto}
    .add .btn,.add .mini{flex:0 0 auto}
    /* 记账表单：手机上“类型整行 + 金额/类别一行 + 按钮一行” */
    .money-add{display:grid; grid-template-columns:1fr 1fr; gap:8px}
    .money-add select{grid-column:1 / -1}
    .money-add .mini,.money-add .btn{margin-top:0}
    .money-add input{flex:none}
    /* 习惯打卡：手机上“名称+删除”一行，星期铺开另起一行 */
    .habit .name{flex:1 1 auto; min-width:0}
    .habit .del{flex:0 0 auto; align-self:center}
    .week{flex:1 1 100%; justify-content:space-between; max-width:none; gap:4px}
  }
  /* ---------- 更多（手机底部弹层） ---------- */
  .sheet-mask{position:fixed; inset:0; background:rgba(74,64,57,.35); z-index:60; display:none; opacity:0; transition:opacity .2s}
  .sheet-mask.on{display:block; opacity:1}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--card); border-radius:22px 22px 0 0;
    padding:6px 10px calc(14px + env(safe-area-inset-bottom)); max-height:74vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .28s ease}
  .sheet-mask.on .sheet{transform:translateY(0)}
  .sheet-grab{width:38px; height:4px; border-radius:3px; background:var(--line); margin:6px auto 10px}
  .sheet-title{font-size:12px; color:var(--muted); padding:0 14px 4px; font-weight:600; letter-spacing:.5px}
  .sheet-row{display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:14px; font-size:16px; cursor:pointer; color:var(--ink)}
  .sheet-row:active{background:#FBF7EF}
  .sheet-badge{width:42px; height:42px; border-radius:13px; display:grid; place-items:center; font-size:21px; flex:0 0 auto; box-shadow:0 2px 7px rgba(90,70,40,.12)}
  .sheet-name{flex:1; font-weight:500; line-height:1.2}
  .sheet-check{margin-left:auto; color:var(--green); font-weight:700; font-size:17px}
  .sheet-row.active{background:rgba(143,191,111,.13)}
  .sheet-row.active .sheet-name{color:var(--green-d); font-weight:600}
  .sheet-row.divider{border-top:1px solid var(--line); margin-top:6px; padding-top:14px}
  .more-ic{display:grid; grid-template-columns:repeat(2,4px); grid-template-rows:repeat(2,4px); gap:3px; width:20px; height:20px}
  .more-ic i{background:currentColor; border-radius:1.5px}

  /* 自定义底部栏 */
  .tab-edit-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:12px; cursor:pointer; user-select:none}
  .tab-edit-row.off{opacity:.5}
  .tab-edit-row .ic{font-size:21px; width:26px; text-align:center}
  .tab-edit-row .name{flex:1; font-size:15px; color:var(--ink)}
  .tab-edit-row .toggle{width:42px; height:24px; border-radius:13px; background:#D8D2C7; position:relative; transition:.2s; flex:0 0 auto}
  .tab-edit-row .toggle.on{background:var(--green)}
  .tab-edit-row .toggle::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .tab-edit-row .toggle.on::after{left:20px}
  .tab-edit-row .order{display:flex; flex-direction:column; gap:3px; margin-left:4px; flex:0 0 auto}
  .tab-edit-row .order button{width:26px; height:18px; border:1px solid var(--line); background:#FBF7EF; border-radius:5px; font-size:10px; color:var(--muted); cursor:pointer; padding:0; font-family:inherit; line-height:1}
  .tab-edit-row .order button:active{background:var(--green); color:#fff; border-color:var(--green)}
  .tab-edit-row .order button:disabled{opacity:.35; cursor:not-allowed}
  .tab-edit-save{display:block; margin:14px auto 6px; padding:10px 32px; background:var(--green); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit}
  .tab-edit-hint{font-size:12px; color:var(--muted); text-align:center; padding:2px 16px 4px}

  /* ===== 综合首页（v15） ===== */
  .home-hero{
    background:linear-gradient(135deg, color-mix(in srgb, var(--green) 12%, var(--card)) 0%, var(--card) 60%);
    border:1px solid var(--line); border-radius:18px; padding:18px 18px 16px;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .home-hero .greet{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .home-hero .greet .hi{font-size:22px; font-weight:600; letter-spacing:.5px}
  .home-hero .greet .em{font-size:24px}
  .home-hero .greet .sub{font-size:13px; color:var(--muted)}
  .home-hero .badge{
    display:inline-flex; align-items:center; gap:6px;
    background:color-mix(in srgb, var(--gold) 18%, var(--card));
    border:1px solid color-mix(in srgb, var(--gold) 35%, var(--card));
    color:var(--ink); font-size:12px; padding:4px 12px; border-radius:99px; margin:4px 0 10px;
  }
  .home-clock{font-size:46px; font-weight:200; letter-spacing:2px;
    font-feature-settings:"tnum"; color:var(--green-d); text-align:center;
    margin:6px 0 6px; line-height:1}
  .home-date{font-size:13px; color:var(--muted); text-align:center}
  .home-date .lunar{margin-left:8px; opacity:.85}

  .home-q{
    margin-top:14px; padding:12px 14px; border-radius:14px;
    background:color-mix(in srgb, var(--green) 8%, var(--card));
    border:1px dashed color-mix(in srgb, var(--green) 40%, var(--card));
  }
  .home-q .lbl{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted)}
  .home-q .lbl .pill{display:inline-flex; gap:4px; align-items:center;
    background:color-mix(in srgb, var(--gold) 25%, transparent);
    padding:2px 9px; border-radius:99px; font-size:11px; color:var(--ink)}
  .home-q .cn{font-size:16px; line-height:1.55; margin:6px 0 4px; font-weight:500}
  .home-q .en{font-size:12px; color:var(--muted); font-style:italic}

  .home-sec{
    margin-top:14px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px 16px; box-shadow:var(--shadow);
  }
  .home-sec h3{display:flex; align-items:center; gap:8px; font-size:15px; margin:0 0 10px; font-weight:600}
  .home-sec h3 .add-btn{margin-left:auto; font-size:12px; color:var(--green-d);
    background:transparent; border:none; cursor:pointer; padding:2px 8px; font-family:inherit; font-weight:500}
  .home-sec h3 .add-btn:hover{background:color-mix(in srgb, var(--green) 10%, transparent); border-radius:6px}

  .countdown-row{

function rgbToHex(r,g,b){const f=x=>("0"+Math.round(x).toString(16)).slice(-2);return "#"+f(r)+f(g)+f(b);}
function mix(c1,c2,t){const a=hexToRgb(c1),b=hexToRgb(c2);return rgbToHex(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t);}
function darken(c,t){return mix(c,"#000000",t);}

// 简易农历日期（只覆盖常见格式，无需精确月相，按干支年近似）
const LUNAR_MONTHS=["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"];
const LUNAR_DAYS=["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
const HEAVENLY=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const EARTHLY=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const ZODIAC=["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
function ganZhiYear(y){
  // 1984 = 甲子年
  const off = (y - 1984 + 60) % 60;
  return HEAVENLY[off % 10] + EARTHLY[off % 12] + "年 · " + ZODIAC[off % 12] + "年";
}
function approxLunar(d){
  // 近似计算：用日期年内累计天数做粗略换算（误差 1-2 天，对文案够用）
  const start=new Date(d.getFullYear(), 0, 0);
  const diff = (d - start)/86400000;
  const offset = 50; // 立春大约在第 50 天附近，正月初一常在 30-65 之间
  let idx = Math.round(diff) - offset;
  if(idx < 0) idx += 354;
  const m = Math.floor(idx / 30);
  const day = (idx % 30) + 1;
  return `${ganZhiYear(d.getFullYear())} · ${LUNAR_MONTHS[Math.max(0,Math.min(11,m))]}${LUNAR_DAYS[Math.max(0,Math.min(29,day-1))]}`;
}

  /* ---- 时间格式化（X月X日 · 星期X 2026  /  HH:MM）---- */
  const W=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  function fmtDate(ts){
    const d=new Date(ts);
    return `<b>${d.getMonth()+1}月${d.getDate()}日</b> · ${W[d.getDay()]} <span class="yr">${d.getFullYear()}</span>`;

const PRIMARY = ["home","tasks","habit","mood","money"];

function buildNav(){
  $("#nav").innerHTML = MODULES.map(m=>
    `<div class="nav-item ${m.id===current?'active':''}" data-m="${m.id}"><span class="ic">${m.ic}</span>${m.name}</div>`).join("");
  const order = (state.tabOrder && state.tabOrder.length) ? state.tabOrder : PRIMARY;
  const orderSet = new Set(order);
  const moreOn = !orderSet.has(current);
  $("#tabbar").innerHTML =
    order.map(id=>{ const m=MODULES.find(x=>x.id===id); return m?`<div class="tab ${id===current?'on':''}" data-m="${id}"><span class="ic">${m.ic}</span>${m.name}</div>`:""; }).join("")
    + `<div class="tab ${moreOn?'on':''}" data-m="__more"><span class="more-ic"><i></i><i></i><i></i><i></i></span>更多</div>`;
  document.querySelectorAll(".nav-item").forEach(el=>el.onclick=()=>{current=el.dataset.m;buildNav();render();});
  document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>{

    current=el.dataset.m; buildNav(); render();

function renderSheet(){
  const order = (state.tabOrder && state.tabOrder.length) ? state.tabOrder : PRIMARY;
  const rest = MODULES.filter(m=>!order.includes(m.id));
  $("#sheetList").innerHTML =
    (rest.length

/* ----- 自定义底部栏（手机底部 Tab） ----- */
function openEdit(){ renderEdit(); $("#editMask").classList.add("on"); }
function closeEdit(){ $("#editMask").classList.remove("on"); }
function renderEdit(){
  const order = (state.tabOrder && state.tabOrder.length) ? state.tabOrder : PRIMARY.slice();
  state.tabOrder = order;
  $("#editList").innerHTML = MODULES.map(m=>{
    const idx = order.indexOf(m.id);
    const on = idx>=0;
    const arrows = on ? `<span class="order">
      <button data-up="${m.id}" ${idx===0?'disabled':''}>▲</button>
      <button data-down="${m.id}" ${idx===order.length-1?'disabled':''}>▼</button>
    </span>` : '';
    return `<div class="tab-edit-row ${on?'':'off'}" data-id="${m.id}">
      <span class="ic">${m.ic}</span>
      <span class="name">${m.name}</span>
      <span class="toggle ${on?'on':''}" data-toggle="${m.id}"></span>
      ${arrows}
    </div>`;
  }).join("");
  $("#editList").querySelectorAll(".tab-edit-row").forEach(row=>{
    row.onclick = e=>{
      if(e.target.closest("[data-up]")||e.target.closest("[data-down]")) return;
      toggleTab(row.dataset.id);
    };
  });
  $("#editList").querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick = e=>{ e.stopPropagation(); toggleTab(el.dataset.toggle); };
  });
  $("#editList").querySelectorAll("[data-up]").forEach(el=>{
    el.onclick = e=>{ e.stopPropagation(); moveTab(el.dataset.up, -1); };
  });
  $("#editList").querySelectorAll("[data-down]").forEach(el=>{
    el.onclick = e=>{ e.stopPropagation(); moveTab(el.dataset.down, 1); };
  });
}
function toggleTab(id){
  if(!state.tabOrder) state.tabOrder = PRIMARY.slice();
  const i = state.tabOrder.indexOf(id);
  if(i>=0) state.tabOrder.splice(i,1);
  else state.tabOrder.push(id);
  renderEdit();
}
function moveTab(id, dir){
  if(!state.tabOrder) state.tabOrder = PRIMARY.slice();
  const i = state.tabOrder.indexOf(id);
  if(i<0) return;
  const j = i+dir;
  if(j<0||j>=state.tabOrder.length) return;
  const x = state.tabOrder.splice(i,1)[0];
  state.tabOrder.splice(j,0,x);
  renderEdit();
}
function saveTabEdit(){
  if(!state.tabOrder || !state.tabOrder.length) state.tabOrder = PRIMARY.slice();
  save(); closeEdit(); buildNav();
  if(current==="settings") render();
}

function render(){
  const m = MODULES.find(x=>x.id===current);
  $("#title").textContent = m.name;
  $("#view").innerHTML = VIEWS[current]();
  bind();
  if(current==="home") tickHomeClock();
}

let _homeClockTimer = null;
function tickHomeClock(){
  const el = document.getElementById("homeClock");
  if(!el) return;
  if(_homeClockTimer) clearInterval(_homeClockTimer);
  const update = ()=>{
    const d=new Date();
    const hh=String(d.getHours()).padStart(2,"0");
    const mm=String(d.getMinutes()).padStart(2,"0");
    const ss=String(d.getSeconds()).padStart(2,"0");
    el.textContent = `${hh}:${mm}:${ss}`;
  };
  update();
  _homeClockTimer = setInterval(update, 1000);
}
function daysUntil(dateStr){
  if(!dateStr) return 0;
  const target = new Date(dateStr+"T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target - today)/86400000);
}
function sortCountdowns(){
  if(!Array.isArray(state.countdowns)) state.countdowns=[];
  state.countdowns.sort((a,b)=>daysUntil(a.date)-daysUntil(b.date));
}
function addCountdown(){
  const tEl=document.getElementById("cd-title");
  const dEl=document.getElementById("cd-date");
  if(!tEl||!dEl) return;
  const title=tEl.value.trim();
  const date=dEl.value;
  if(!title||!date) return;
  state.countdowns = state.countdowns || [];
  state.countdowns.push({id:uid(), title, date, emoji:"📌"});
  tEl.value=""; dEl.value=""; dEl.type="text"; dEl.value="";
  save(); render();
}
function delCountdown(id){
  state.countdowns = (state.countdowns||[]).filter(x=>x.id!==id);
  save(); render();
}
function toggleCdAdd(){
  const el=document.getElementById("cdAdd");
  if(el) el.style.display = (el.style.display==="none"||el.style.display==='') ? "flex":"none";
}

          <div class="del" onclick="delMoney(${i})">删</div></div>`).join("")}
    </div>
    <div class="card">
      <h2>📈 基金持仓 <span class="tag">总值 ¥${fundTotal.toLocaleString()}</span></h2>
      <div class="row"><div class="txt"><b>持仓总市值</b></div>
        <div class="${fundChg>=0?'up':'down'}" style="font-weight:600">${fundChg>=0?'+':''}¥${Math.round(fundChg).toLocaleString()} 今日</div></div>
      ${state.funds.map((f,i)=>`
        <div class="row"><div class="txt"><b>${esc(f.name)}</b><div class="meta">${f.code}</div></div>
          <div style="text-align:right"><div class="v" style="font-size:16px">¥${f.value.toLocaleString()}</div>
          <div class="${f.change>=0?'up':'down'}" style="font-size:12px">${f.change>=0?'+':''}${f.change}%</div></div>
          <div class="del" onclick="delFund(${i})">删除</div></div>`).join("")}
      ${state.funds.length?"":'<div class="empty">还没有基金，下面加一只</div>'}
      <div class="add" style="margin-top:12px">
        <input id="f-name" placeholder="基金名"/>
        <input id="f-code" placeholder="代码"/>
        <input id="f-val" type="number" placeholder="市值"/>
        <button class="btn" onclick="addFund()">加基金</button>
      </div>
    </div>`;
  },

  notes:()=>{
    return `
    <div class="card">
      <h2>🗒️ 便签墙</h2>
      <div class="add"><input id="n-in" placeholder="写一张便签，回车添加"/><button class="btn" onclick="addNote()">添加</button></div>
      <div class="ic-pick" id="icPick">${NOTE_ICONS.map(i=>`<button class="ic-chip${i===noteSelIc?' on':''}" onclick="pickIc('${i}')">${i}</button>`).join('')}</div>
      <div class="notes" style="margin-top:14px">
        ${state.notes.slice().reverse().map(n=>{
          const ts=n.ts||Date.now();
          return `<div class="diary" style="background:${n.color}">
            <div class="diary-head">
              <div class="diary-av" style="background:rgba(255,255,255,.6)">${n.ic||'🗒️'}</div>
              <div><div class="diary-name">便签</div>
                <div class="diary-sub" style="color:#6b5b3a">${n.t&&!/^\d{2}-\d{2}$/.test(n.t)?esc(n.t):'随手记'}</div></div>
              <div class="diary-time">${fmtDate(ts)}</div>
            </div>
            <div class="diary-body">${esc(n.text)}</div>
            <div class="diary-foot" style="border-color:rgba(0,0,0,.08)"><span class="clk">🕒 ${fmtTime(ts)}</span><span class="x" onclick="delNote(${n.id})">删除</span></div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  },

  whisper:()=>`
    <div class="card">
      <h2>🌳 树洞 <span class="tag">只对自己说的话</span></h2>
      <div class="add"><input id="w-in" placeholder="说点什么……"/><button class="btn" onclick="addWhisper()">写下</button></div>
      ${state.whisper.map((x,i)=>{
        const item = typeof x==="string" ? {text:x,ts:Date.now()} : x;
        return `<div class="diary">
          <div class="diary-head">
            <div class="diary-av">🌿</div>
            <div><div class="diary-name">树洞</div>
              <div class="diary-sub">只有自己看见</div></div>
            <div class="diary-time">${fmtDate(item.ts)}</div>
          </div>
          <div class="diary-body">${esc(item.text)}</div>
          <div class="diary-foot"><span class="clk">🕒 ${fmtTime(item.ts)}</span><span class="x" onclick="delWhisper(${i})">删除</span></div>
        </div>`;
      }).join("")}
    </div>`,

  settings:()=>{
    const order = (state.tabOrder && state.tabOrder.length) ? state.tabOrder : PRIMARY;
    const pinned = order.map(id=>MODULES.find(x=>x.id===id)).filter(Boolean);
    const bgSaved = loadBg();
    const cardSaved = loadCard();
    return `
    <div class="card">
      <h2>⚙️ 设置</h2>

      <div class="set-sec">
        <div class="set-t">主题强调色</div>
        <div class="theme-row">${THEMES.map(t=>`<button class="theme-dot${curTheme.key===t.key?' on':''}" title="${t.name}" style="background:${t.v.green}" onclick="pickTheme('${t.key}')"></button>`).join("")}
          <button class="theme-dot theme-custom${curTheme.key==='custom'?' on':''}" title="自定义颜色" onclick="setOpenCustom()">+</button></div>
        <div id="setCustomTheme" style="display:${curTheme.key==='custom'?'flex':'none'};margin-top:12px;align-items:center;gap:12px">
          <input type="color" id="setThemeColor" value="${curTheme.key==='custom'?curTheme.v.green:'#8FBF6F'}" oninput="setPreviewCustom()" style="width:46px;height:40px;border:none;background:none;cursor:pointer;padding:0"/>
          <button class="btn sm" onclick="setApplyCustom()">应用自定义色</button>
        </div>
      </div>

      <div class="set-sec">
        <div class="set-t">背景颜色</div>
        <div class="theme-row">${BG_PRESETS.map(c=>`<button class="theme-dot${bgSaved===c?' on':''}" title="${c}" style="background:${c}" onclick="setBg('${c}')"></button>`).join("")}
          <label class="theme-dot theme-custom" title="自定义背景" style="cursor:pointer;position:relative;overflow:hidden">
            <span style="font-size:16px">🎨</span>
            <input type="color" value="${bgSaved||'#FBF4E9'}" oninput="setBg(this.value)" style="position:absolute;inset:0;opacity:0;cursor:pointer;border:none;padding:0"/>
          </label>
        </div>
        <div class="set-hint">选一个背景色调，或点 🎨 取任意颜色。强调色与背景色可分别设置，互不影响。</div>
      </div>

      <div class="set-sec">
        <div class="set-t">卡片/面板背景</div>
        <div class="theme-row">${CARD_PRESETS.map(c=>`<button class="theme-dot${cardSaved===c?' on':''}" title="${c}" style="background:${c};border-color:rgba(0,0,0,.18)" onclick="setCard('${c}')"></button>`).join("")}
          <label class="theme-dot theme-custom" title="自定义卡片背景" style="cursor:pointer;position:relative;overflow:hidden">
            <span style="font-size:16px">🎨</span>
            <input type="color" value="${cardSaved||'#FFFFFF'}" oninput="setCard(this.value)" style="position:absolute;inset:0;opacity:0;cursor:pointer;border:none;padding:0"/>
          </label>
        </div>
        <div class="set-hint">便签、卡片、抽屉、弹层、桌面侧栏等所有"面板"的底色都会跟着变（文字色保持不变）。</div>
      </div>

      <div class="set-sec">
        <div class="set-t">主要功能区</div>
        <div class="set-hint">固定到手机底部栏、或在「更多」里出现的模块。下方为当前已固定项，点按钮调整显示与顺序。</div>
        <div class="pin-chips">${pinned.map(m=>`<span class="pin-chip"><span class="pin-dot" style="background:${m.color}"></span>${m.name}</span>`).join("")}</div>
        <button class="btn" style="margin-top:12px" onclick="openEdit()">✏️ 自定义主要功能区</button>

/* ---------------- 交互 ---------------- */
function uid(){return Date.now()}
function bind(){
  const ti=$("#t-in"); if(ti) ti.onkeydown=e=>{if(e.key==="Enter")addTask()};
  const ni=$("#n-in"); if(ni) ni.onkeydown=e=>{if(e.key==="Enter")addNote()};
  const ii=$("#i-in"); if(ii) ii.onkeydown=e=>{if(e.key==="Enter")addIdea()};
  const wi=$("#w-in"); if(wi) wi.onkeydown=e=>{if(e.key==="Enter")addWhisper()};
}
function addTask(){const v=$("#t-in").value.trim();if(!v)return;state.tasks.push({id:uid(),text:v,done:false});save();render()}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}
function delTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();render()}
/* 习惯 ↔ 任务清单联动：把当天习惯生成成每日任务，次日自动刷新 */
function syncHabitTasks(){
  const today=dayKey();
  state.habit.forEach(h=>{ if(h.id===undefined||h.id===null) h.id=uid(); });
  if(state.habitTaskDate===today) return;
  state.tasks=state.tasks.filter(t=>!t.habit);
  state.habit.forEach(h=>state.tasks.push({id:uid(),text:h.name,done:false,habit:true,hid:h.id,day:today}));
  state.habitTaskDate=today; save();
}
function addHabit(){const v=$("#h-in").value.trim();if(!v)return;
  const h={id:uid(),name:v,week:[0,0,0,0,0,0,0]};
  state.habit.push(h);
  const today=dayKey();
  if(state.habitTaskDate!==today){ syncHabitTasks(); }
  else { state.tasks.push({id:uid(),text:v,done:false,habit:true,hid:h.id,day:today}); }
  save();render();
  const i=$("#h-in"); if(i) i.value="";
}
function delHabit(i){const h=state.habit[i];const id=h&&h.id;
  state.habit.splice(i,1);
  if(id) state.tasks=state.tasks.filter(t=>!(t.habit && t.hid===id));
  save();render();
}
function toggleHabit(i,j){state.habit[i].week[j]=state.habit[i].week[j]?0:1;save();render()}
function logMood(e,l){state._lastMood={emoji:e,label:l};save();render()}
function saveMoodNote(){const note=$("#m-note").value.trim();const last=state._lastMood||{emoji:"🙂",label:"一般"};
  state.mood.push({id:uid(),emoji:last.emoji,label:last.label,note,ts:Date.now()});save();render();
  const i=$("#m-note"); if(i) i.value="";}
function addIdea(){const v=$("#i-in").value.trim();if(!v)return;state.idea.unshift(v);save();render()}
function delIdea(i){state.idea.splice(i,1);save();render()}
function addMoney(){const type=$("#m-type").value;const amt=+$("#m-amt").value;if(!amt)return;
  const cat=$("#m-cat").value.trim()||(type==="in"?"存入":"支出");
  state.money.records.unshift({date:new Date().toISOString().slice(5,10),type,cat,amount:amt,note:""});
  state.money.saved+=type==="in"?amt:-amt;save();render()}
function delMoney(i){const r=state.money.records[i];state.money.saved+=r.type==="in"?-r.amount:r.amount;
  state.money.records.splice(i,1);save();render()}
function addFund(){const name=$("#f-name").value.trim();const code=$("#f-code").value.trim();const val=+$("#f-val").value;
  if(!name||!val) return; state.funds.push({name,code,value:val,change:0}); save(); render();}
function delFund(i){ state.funds.splice(i,1); save(); render(); }
function clearMoneyForm(){ const a=$("#m-amt"); if(a)a.value=""; const c=$("#m-cat"); if(c)c.value=""; if(a)a.focus(); }
function resetSavings(){ if(!confirm("确定把已存金额清0吗？目标金额会保留。")) return; state.money.saved=0; save(); render(); }
function setGoal(v){ const n=Math.max(0, Math.round(+v||0)); state.money.goal=n; save(); render(); }
function setProj(name,st){const p=state.project.find(x=>x.name===name);p.status=st;save();render()}
function addNote(){const v=$("#n-in").value.trim();if(!v)return;
  const cs=["#FFF2B8","#D6E8C8","#FBD3D3","#D3E4FB","#EAD9F2","#FCE4C8"];
  state.notes.push({id:uid(),color:cs[Math.floor(Math.random()*cs.length)],ic:noteSelIc,text:v,ts:Date.now()});save();render();
  const i=$("#n-in"); if(i) i.value="";}
function pickIc(ic){ noteSelIc=ic; document.querySelectorAll('#icPick .ic-chip').forEach(c=>c.classList.toggle('on', c.textContent===ic)); }
function delNote(id){state.notes=state.notes.filter(x=>x.id!==id);save();render()}
function delMood(id,idx){if(id) state.mood=state.mood.filter(x=>x.id!==id); else state.mood.splice(idx,1); save();render()}
function addWhisper(){const v=$("#w-in").value.trim();if(!v)return;
  state.whisper.unshift({text:v,ts:Date.now()});save();render();
  const i=$("#w-in"); if(i) i.value="";}
function delWhisper(i){state.whisper.splice(i,1);save();render()}

/* ---------------- 账户 / Supabase 云同步 ---------------- */
function toggleModal(){ $("#accountModal").classList.toggle("on"); renderModal(); }

function renderAccount(){
  const btn=$("#accountBtn"); const cfg=getCfg();
  if(user) btn.innerHTML=`<button class="account-btn" onclick="toggleModal()"><span class="avatar">${esc((user.email||'?')[0].toUpperCase())}</span><span class="sync-dot"></span>已同步</button>`;
  else if(cfg&&cfg.url) btn.innerHTML=`<button class="account-btn" onclick="toggleModal()"><span class="sync-dot off"></span>未登录</button>`;
  else btn.innerHTML=`<button class="account-btn" onclick="toggleModal()">📱 本地模式</button>`;
  renderModal();
}

function renderModal(){
  const m=$("#accountModal"); if(!m) return;
  const cfg=getCfg();
  let h=`<div class="box"><span class="close" onclick="toggleModal()">×</span>`;
  if(user){
    h+=`<h3>☁️ 云端已连接</h3>
      <div class="tip">账号：<b>${esc(user.email)}</b></div>
      <div class="row2"><button class="btn" onclick="pullCloud(true)">立即同步</button><button class="btn ghost" onclick="logout()">退出</button></div>
      <div class="tip">数据实时存到云端，换设备登录同一账号即可恢复。别人通过分享链接也能安装这个 App，各自数据独立。</div>`;
  } else if(cfg&&cfg.url){
    h+=`<h3>登录云端</h3>
      <div class="field"><label>邮箱</label><input id="a-email" placeholder="you@example.com"/></div>
      <div class="field"><label>密码</label><input id="a-pwd" type="password" placeholder="密码"/></div>
      <div class="err" id="a-err"></div>
      <div class="row2"><button class="btn" onclick="login()">登录</button><button class="btn ghost" onclick="signup()">注册</button></div>
      <div class="row2"><button class="btn ghost" onclick="editCfg()">改配置</button></div>
      <div class="tip">没有账号点「注册」。若收不到验证邮件，请在 Supabase 后台 Authentication → Providers 关闭 Email 确认。</div>`;
  } else {
    h+=`<h3>📱 本地模式</h3>
      <div class="tip">当前数据只存在这台设备，打开即用、无需注册。想要多设备同步时再开启云同步。</div>
      <div class="row2"><button class="btn ghost" onclick="toggleModal()">继续本地使用</button><button class="btn" onclick="showCfg()">开启云同步</button></div>
      <div id="cfg-box" style="display:none;margin-top:14px">
        <div class="field"><label>Supabase 项目 URL</label><input id="c-url" placeholder="https://xxxx.supabase.co"/></div>
        <div class="field"><label>Anon Key</label><input id="c-key" placeholder="eyJ..."/></div>
        <div class="err" id="c-err"></div>
        <button class="btn" onclick="saveCfg()">保存并连接</button>
        <div class="tip">免费建项目：<a href="https://supabase.com" target="_blank">supabase.com</a> → 复制 Project URL 与 Anon Key（Project Settings → API），并在 SQL Editor 执行 supabase-schema.sql。</div>
      </div>`;
  }
  // 主题配色选择器（所有模式都可见）
  h+=`<div class="theme-block"><div class="theme-label">🎨 主题配色</div>
    <div class="theme-row">${THEMES.map(t=>`<button class="theme-dot${curTheme.key===t.key?' on':''}" title="${t.name}" style="background:${t.v.green}" onclick="pickTheme('${t.key}')"></button>`).join("")}
    <button class="theme-dot theme-custom${curTheme.key==='custom'?' on':''}" title="自定义颜色" onclick="openCustomTheme()">+</button></div>
    <div id="customTheme" style="display:${curTheme.key==='custom'?'flex':'none'};margin-top:12px;align-items:center;gap:12px">
      <input type="color" id="themeColor" value="${curTheme.key==='custom'?curTheme.v.green:'#8FBF6F'}" oninput="previewCustomTheme()" style="width:46px;height:40px;border:none;background:none;cursor:pointer;padding:0"/>
      <button class="btn sm" onclick="applyCustomTheme()">应用自定义色</button>
      <span style="font-size:12px;color:var(--muted)">选色后自动生成配色</span>
    </div>
  </div>`;
  h+=`</div>`; m.innerHTML=h;
}

function saveCfg(){
  const url=$("#c-url").value.trim(), key=$("#c-key").value.trim();
  if(!url||!key){ $("#c-err").textContent="URL 和 Key 都要填"; return; }
  localStorage.setItem(CFG_KEY, JSON.stringify({url,key}));
  initSb(); renderAccount();
}
function editCfg(){ localStorage.removeItem(CFG_KEY); sb=null; user=null; renderAccount(); }
function showCfg(){ const b=document.getElementById("cfg-box"); if(b) b.style.display="block"; }

function initSb(){
  const cfg=getCfg();
  if(!window.supabase || !cfg || !cfg.url || !cfg.key){ renderAccount(); return; }
  try{
    sb = window.supabase.createClient(cfg.url, cfg.key);
    sb.auth.getUser().then(({data})=>{ user=data.user||null; if(user) pullCloud(false); else renderAccount(); });
    sb.auth.onAuthStateChange((_e,s)=>{ user=s&&s.user||null; if(user) pullCloud(false); renderAccount(); });
    renderAccount();
  }catch(e){ renderAccount(); }
}

async function login(){
  const email=$("#a-email").value.trim(), pwd=$("#a-pwd").value;
  const {error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error) $("#a-err").textContent=error.message;
}
async function signup(){
  const email=$("#a-email").value.trim(), pwd=$("#a-pwd").value;
  const {error}=await sb.auth.signUp({email,password:pwd});
  if(error) $("#a-err").textContent=error.message;
  else $("#a-err").textContent="注册成功，请查收验证邮件（或联系管理员关闭确认）后登录。";
}
async function logout(){ await sb.auth.signOut(); user=null; renderAccount(); }

async function pullCloud(manual){
  if(!sb||!user) return;
  const {data,error}=await sb.from("workbench_state").select("data").eq("user_id",user.id).maybeSingle();
  if(error) return;
  if(data && data.data){ state=data.data; save_local(); syncHabitTasks(); render(); }
  else { save(); } // 云端还没有 → 把本地推上去
  if(manual) renderAccount();
}

/* ---------------- 启动 ---------------- */
(function init(){
  const d=new Date();
  const wk=W[d.getDay()];
  $("#date").textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${wk} · 农历 ${approxLunar(d)}`;
  const h=d.getHours();
  $("#hello").textContent = h<11?"早上好 ☀️ "+userName():h<18?"下午好 🌿 "+userName():"晚上好 🌙 "+userName();
  applyTheme(curTheme.v);
  const savedBg = loadBg(); if(savedBg){ document.documentElement.style.setProperty("--bg", savedBg); const mc=document.querySelector('meta[name=theme-color]'); if(mc) mc.setAttribute("content", savedBg); }
  const savedCard = loadCard(); if(savedCard) document.documentElement.style.setProperty("--card", savedCard);
  buildNav(); syncHabitTasks(); render(); renderAccount(); initSb();
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
  // 每 60 秒检测跨天：次日自动清掉旧习惯任务、刷新今日清单
  setInterval(()=>{ const t=dayKey(); if(state.habitTaskDate!==t){ syncHabitTasks(); if(current==="tasks"||current==="home") render(); } }, 60000);
})();
</script>
