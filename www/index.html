function doCreate(channel){
  const d=payDraft; if(!d){ return; }
  const {amt,cat,mer,date,api}=d;
  const note=mer;
  const key=(getCfg()&&getCfg().payKey||"").trim();
  const headers={"Content-Type":"application/json"};
  if(key) headers["x-api-key"]=key;
  setPayHint("正在创建支付订单…");
  fetch(api+"/api/pay/create",{method:"POST",headers,
    body:JSON.stringify({channel,amount:amt,description:cat,category:cat,note,userId:getUid()})})
    .then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{
      if(!ok||!j.ok) throw new Error(j.msg||"下单失败");
      let payUrl=j.payUrl||"";
      if(j.sandbox && key && payUrl) payUrl += (payUrl.indexOf("?")>=0?"&":"?") + "key=" + encodeURIComponent(key);
      const pending={payApi:api,outTradeNo:j.outTradeNo,record:{date,type:"out",cat,amount:amt,note:mer}};
      localStorage.setItem("wb_pending_pay",JSON.stringify(pending));
      document.querySelectorAll(".pay-sheet").forEach(s=>s.remove());
      window.location.href=payUrl;
    })
    .catch(err=>setPayHint("创建订单失败："+(err.message||err)));

function pollPendingPay(){
  if(window.__wbPayPolling) return; // 防止重复加载导致多个轮询叠加
  let p; try{ p=JSON.parse(localStorage.getItem("wb_pending_pay")||"null"); }catch(e){ return; }
  if(!p) return;
  window.__wbPayPolling=true;
  setPayHint("⏳ 支付确认中…（完成支付后回到本页会自动记账）");
  const iv=setInterval(async()=>{
    try{
      const key=(getCfg()&&getCfg().payKey||"").trim();
      const q=`${p.payApi}/api/pay/query?out_trade_no=${encodeURIComponent(p.outTradeNo)}`+(key?("&key="+encodeURIComponent(key)):"");
      const r=await fetch(q).then(x=>x.json());
      if(r.ok&&r.status==="paid"){
        clearInterval(iv); window.__wbPayPolling=false;
        writeRecord(p.record);
        localStorage.removeItem("wb_pending_pay");
        setPayHint("✅ 支付成功，已记账并云同步");
        moneyImg=""; moneyRec=null; moneyRecState="none"; moneyRecErr="";
        render();
        setTimeout(()=>setPayHint(""),2500);
      }
    }catch(e){}
  },2000);
  setTimeout(()=>{ clearInterval(iv); window.__wbPayPolling=false; },180000);
}

function saveCfg(){
  const url=$("#c-url").value.trim(), key=$("#c-key").value.trim();
  if(!url||!key){ $("#c-err").textContent="URL 和 Key 都要填"; return; }
  const c=getCfg()||{}; localStorage.setItem(CFG_KEY, JSON.stringify({...c,url,key}));
  initSb(); renderAccount();
}
function editCfg(){ localStorage.removeItem(CFG_KEY); sb=null; user=null; renderAccount(); }
function showCfg(){ const b=document.getElementById("cfg-box"); if(b) b.style.display="block"; }

function initSb(){
  const cfg=getCfg();
  if(!window.supabase || !cfg || !cfg.url || !cfg.key){ renderAccount(); return; }
  try{
    sb = window.supabase.createClient(cfg.url, cfg.key);
    sb.auth.getUser().then(({data})=>{ user=data.user||null; if(user) pullCloud(false); else renderAccount(); });
    sb.auth.onAuthStateChange((_e,s)=>{ user=s&&s.user||null; if(user) pullCloud(false); renderAccount(); });
    renderAccount();
  }catch(e){ renderAccount(); }
}

async function login(){
  const email=$("#a-email").value.trim(), pwd=$("#a-pwd").value;
  const {error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error) $("#a-err").textContent=error.message;
}
async function signup(){
  const email=$("#a-email").value.trim(), pwd=$("#a-pwd").value;

  if(error) $("#a-err").textContent=error.message;

async function pullCloud(manual){
  if(!sb||!user) return;
  const {data,error}=await sb.from("workbench_state").select("data").eq("user_id",user.id).maybeSingle();
  if(error) return;
  if(data && data.data){ state=mergeState(data.data); save_local(); syncHabitTasks(); syncFitTasks(); render(); }
  else { save(); } // 云端还没有 → 把本地推上去
  if(manual) renderAccount();
}

/* ================= 在线更新检测 ================= */
function cmpVer(a,b){ const x=String(a).split('.').map(Number), y=String(b).split('.').map(Number); for(let i=0;i<3;i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; }
const APK_DOWNLOAD_URL = 'https://github.com/Stardust-Echo/workbench-pwa/actions';
let lastRemoteVersion = null;      // 最近一次检测到的远端版本信息（供 doUpdate 使用）

// 从 GitHub Actions API 或 version.json 获取最新版本信息
async function fetchRemoteVersion(){
  // 1) 优先监控 GitHub Actions：每次 master 有新 run 就提示更新
  try{
    const api = 'https://api.github.com/repos/Stardust-Echo/workbench-pwa/actions/runs?branch=master&status=success&per_page=1';
    const r = await fetch(api, {cache:'no-store'});
    if(r.ok){
      const data = await r.json();
      const run = data.workflow_runs && data.workflow_runs[0];
      if(run){
        return {
          version: null,
          commit: run.head_sha,
          run_number: run.run_number,
          run_url: run.html_url,
          apk_url: run.html_url,
          notes: run.display_title || (run.head_commit && run.head_commit.message) || '',
          date: run.created_at,
          source: 'github-actions'
        };
      }
    }
  }catch(e){ /* 网络/CORS 限制时走下方兜底 */ }

  // 2) 兜底：version.json（CDN / raw）
  const urls = [
    'https://cdn.jsdelivr.net/gh/Stardust-Echo/workbench-pwa@master/version.json',
    'https://raw.githubusercontent.com/Stardust-Echo/workbench-pwa/master/version.json'
  ];
  for(const u of urls){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j.version){ j.source='version-json'; return j; }
    }catch(e){ /* 试下一个源 */ }
  }

  // 3) 本地兜底（浏览器/PWA 同源部署用；APK 里取到的是包内死路）
  try{
    const r = await fetch('version.json', {cache:'no-store'});
    if(r.ok){ const j=await r.json(); if(j&&j.version){j.source='local'; return j;} }
  }catch(e){}

  return null;
}

function shortSha(sha){ return sha ? sha.substring(0,7) : ''; }

function isNewerVersion(j){
  if(!j) return false;
  // 优先用 GitHub Actions 的 commit 对比（最准，每次 push 都变）
  if(j.commit && shortSha(j.commit) !== APP_COMMIT) return true;
  // 其次用 run_number
  if(j.run_number && j.run_number > APP_BUILD) return true;
  // 最后回退到语义版本号
  if(j.version && cmpVer(j.version, APP_VERSION) > 0) return true;
  return false;
}

async function checkForUpdate(){
  const j = await fetchRemoteVersion();
  lastRemoteVersion = j;
  window.__UPDATE_URL = (j && j.url) || '';   // OTA zip 包地址（由 version.json 提供）
  if(!j) return false;
  if(isNewerVersion(j)){
    const bar = document.getElementById('upd');
    const vEl = document.getElementById('upd-v');
    const nEl = document.getElementById('upd-n');
    const vText = (j.version ? 'v'+j.version : 'Build #'+j.run_number) +
                  (j.commit ? ' ('+shortSha(j.commit)+')' : '');
    if(vEl) vEl.textContent = vText;
    if(nEl) nEl.textContent = j.notes || '';
    if(bar) bar.hidden = false;
    return true;
  }
  return false;
}
function hideUpdate(){ const b=document.getElementById('upd'); if(b) b.hidden=true; }
async function manualCheckUpdate(){
  const s=document.getElementById('upd-status');
  if(s){ s.textContent='检查中…'; s.style.color='var(--muted)'; }
  const found = await checkForUpdate();
  if(s){
    if(found){
      s.textContent = '发现新版本';
      s.style.color = 'var(--green-d)';
    } else if(lastRemoteVersion){
      s.textContent = '已是最新版本 (v'+APP_VERSION+' #'+APP_BUILD+')';
      s.style.color = 'var(--green-d)';
    } else {
      s.textContent = '检查失败，请检查网络';
      s.style.color = 'var(--red)';
    }
  }
}
function doUpdate(){
  hideUpdate();
  const isAPK = !!window.Capacitor || /android|iphone|ipad|ipod/i.test(navigator.userAgent) || location.hostname === 'localhost';
  const url = (lastRemoteVersion && (lastRemoteVersion.apk_url || lastRemoteVersion.run_url)) || APK_DOWNLOAD_URL;
  if(isAPK){
    // APK：优先用 capacitor-updater 做应用内热更新（不跳浏览器）；失败再回退浏览器下载
    const zipUrl = window.__UPDATE_URL;
    const U = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorUpdater;
    if(U && zipUrl){
      U.download({ url: zipUrl }).then(b=>U.set({ id: b.id }))
        .then(()=>{ location.reload(true); })
        .catch(err=>{ console.warn('OTA 更新失败，转浏览器下载', err); try{ window.open(url, '_blank'); }catch(e){} });
    } else {
      try{ window.open(url, '_blank'); }catch(e){}
    }
  } else {
    // 浏览器/PWA：尝试更新 SW，同时打开下载页
    if(navigator.serviceWorker){
      try{ navigator.serviceWorker.getRegistration().then(reg=>{ if(reg) reg.update(); }).catch(()=>{}); }catch(e){}
    }
    setTimeout(()=>{ try{ window.open(url, '_blank'); }catch(e){} location.reload(true); }, 120);
  }
}

             <button class="lg-qc notes"   onclick="selectModule('notes')">
               <span class="lg-qc-ic">🗒️</span>
               <span class="lg-qc-main"><b>便签</b><small>随手小记</small></span>
               <span class="lg-qc-arr">›</span>
             </button>
             <button class="lg-qc whisper" onclick="selectModule('whisper')">
               <span class="lg-qc-ic">🌳</span>
               <span class="lg-qc-main"><b>树洞</b><small>说说心里话</small></span>
               <span class="lg-qc-arr">›</span>
             </button>
             <button class="lg-qc money"   onclick="selectModule('money')">
               <span class="lg-qc-ic">💰</span>
               <span class="lg-qc-main"><b>记账</b><small>收支明细</small></span>
               <span class="lg-qc-arr">›</span>
             </button>
             <button class="lg-qc tasks"   onclick="selectModule('tasks')">
               <span class="lg-qc-ic">📝</span>
               <span class="lg-qc-main"><b>任务</b><small>今天要做</small></span>
               <span class="lg-qc-arr">›</span>
             </button>
           </div>
         </div>`;
    return `
    <div class="lg-wrap">
      <!-- 概览统计 -->
      <div class="lg-stats">
        <div class="lg-stat-card c1">
          <div class="lg-stat-ic">📅</div>
          <div class="lg-stat-num">${monthDays}</div>
          <div class="lg-stat-lab">本月已记 / ${daysInMonth} 天</div>
        </div>
        <div class="lg-stat-card c2">
          <div class="lg-stat-ic">🔥</div>
          <div class="lg-stat-num">${streak}</div>
          <div class="lg-stat-lab">连续打卡</div>
        </div>
        <div class="lg-stat-card c3">
          <div class="lg-stat-ic">📊</div>
          <div class="lg-stat-num">${totalCount}</div>
          <div class="lg-stat-lab">累计条数</div>
        </div>
      </div>
      <!-- 日历 -->
      <div class="lg-cal">
        <div class="lg-head">
          <button class="lg-nav" onclick="logStepMonth(-1)">‹</button>
          <div class="lg-month">${y}年${m+1}月</div>
          <button class="lg-nav" onclick="logStepMonth(1)">›</button>
        </div>
        <div class="lg-week">${wk.map(w=>`<span>${w}</span>`).join("")}</div>
        <div class="lg-grid">${grid}</div>
        <div class="lg-foot">
          <button class="lg-today" onclick="logGoToday()">回到今天</button>
          <span class="lg-stat">${items.length?("这天共 "+items.length+" 条记录"):"这天暂无记录"}</span>
        </div>
      </div>
      <!-- 最近 7 天心情 -->
      <div class="lg-sec">
        <div class="lg-sec-title"><span class="lg-sec-ic" style="background:linear-gradient(140deg,#F4A6A6,#E7B65A)">🌈</span>最近 7 天心情</div>
        <div class="lg-mood-strip">${moodStrip}</div>
      </div>
      <!-- 选中日详情 -->
      <div class="lg-sec">
        <div class="lg-sec-title"><span class="lg-sec-ic" style="background:#9FC2E8">📅</span>${esc(selLabel)}</div>
        <div class="lg-list">${logHtml}</div>
      </div>
    </div>`;
  };
})();
</script>
<div id="upd" class="upd" hidden>
  <div class="upd-card">
    <div class="upd-h">🆕 发现新版本 <b id="upd-v"></b></div>
    <div class="upd-n" id="upd-n"></div>
    <div class="upd-actions">
      <button class="upd-b" onclick="doUpdate()">立即更新</button>
      <button class="upd-x" onclick="hideUpdate()">稍后</button>
    </div>
  </div>
</div>
</body>
</html>
