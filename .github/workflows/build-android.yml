name: Build Android APK

on:
  workflow_dispatch:        # 允许在 GitHub 网页上手动点一下触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # 该 action 会自动接受 SDK license 并装好 cmdline-tools

      - name: Install Android SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Stamp build metadata into index.html
        run: |
          sed -i "s/const APP_COMMIT  = \"[^\"]*\";/const APP_COMMIT  = \"${GITHUB_SHA::7}\";/" index.html
          sed -i "s/const APP_BUILD   = [0-9]*;/const APP_BUILD   = ${GITHUB_RUN_NUMBER};/" index.html
          grep -E "APP_COMMIT|APP_BUILD" index.html | head -3

      - name: Rebuild www from root sources (ensure latest)
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workbench-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
